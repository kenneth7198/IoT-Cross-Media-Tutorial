# Mosquitto Configuration for macOS
# 適用於 ESP32 IoT Workshop

# 監聽所有網路介面的 1883 埠（MQTT）
listener 1883 0.0.0.0
protocol mqtt

# 監聽所有網路介面的 9001 埠（WebSocket）
listener 9001 0.0.0.0
protocol websockets

# 允許匿名連線（教學用途）
allow_anonymous true

# 持久化設定
persistence true
persistence_location /tmp/mosquitto/

# 日誌輸出到終端機
log_dest stdout
log_type all

# 連線訊息
connection_messages true

# 最大連線數
max_connections -1
